# Default deploy stack for the static portfolio.
#
# Run from the repo root:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
services:
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ${FRONTEND_IMAGE:-glework-frontend:${TAG:-latest}}
    expose:
      - "80"
      - "8080" # nginx stub_status, scraped by nginx-exporter (monitoring overlay)
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
