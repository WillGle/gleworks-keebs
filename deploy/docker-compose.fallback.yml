# Lightweight static portfolio topology for the VPS.
#
#   internet --443--> caddy (auto-TLS) --> frontend (nginx: static SPA)
#
# Run from the repo root:
#   docker compose -f deploy/docker-compose.fallback.yml --env-file deploy/.env up -d --build
#
# Or run from deploy/ directory using Makefile targets by setting COMPOSE file.

services:
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ${FRONTEND_IMAGE:-glework-frontend:${TAG:-latest}}
    expose:
      - "80"
      - "8080" # nginx stub_status, scraped by nginx-exporter (monitoring overlay)
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 100M

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 100M

volumes:
  caddy-data:
  caddy-config:
