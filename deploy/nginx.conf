server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Frame-Options "SAMEORIGIN";
  add_header X-Content-Type-Options "nosniff";

  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json;
}

# Not published to the host in any compose file — only reachable from other
# containers on the same docker network (nginx-prometheus-exporter scrapes it).
server {
  listen 8080;
  location /nginx_status {
    stub_status;
  }
}
