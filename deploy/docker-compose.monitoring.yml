# Optional LGTM-ish observability overlay (Loki + Grafana + Prometheus) for the
# static portfolio stack. Learning sandbox, not required to serve the site.
#
# Joins the same project network as docker-compose.yml, so it must be run
# together with the base stack (or docker-compose.prod.yml):
#
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml \
#     --env-file .env up -d --build
#
# What it watches:
#   - node-exporter    -> host CPU/mem/disk (USE metrics)
#   - nginx-exporter    -> frontend's nginx stub_status (basic RED-ish counters)
#   - caddy             -> Caddy's built-in admin /metrics (reverse-proxy RED metrics)
#   - promtail + loki   -> Caddy/nginx container logs, queried with LogQL for
#                          request rate / error rate since this static site has
#                          no application-level metrics endpoint of its own.
services:
  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    command:
      - "--nginx.scrape-uri=http://frontend:8080/nginx_status"
    depends_on:
      - frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 32M

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - node-exporter
      - nginx-exporter
      - caddy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 192M

  loki:
    image: grafana/loki:3.2.1
    command:
      - "-config.file=/etc/loki/loki-config.yml"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 192M

  promtail:
    image: grafana/promtail:3.2.1
    command:
      - "-config.file=/etc/promtail/promtail-config.yml"
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Read-only bind does not restrict Docker API access; see deploy/README.md.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in deploy/.env}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 192M

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
