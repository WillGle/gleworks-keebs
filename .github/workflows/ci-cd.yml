name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ---- CI: quality gates on every push & PR -------------------------------
  ci:
    name: Lint · Type-check · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test:run
      - run: npm run build

  # ---- CD: build image and publish to GHCR -------------------------------
  images:
    name: Build & push image (GHCR)
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Frontend image metadata
        id: meta-fe
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/glework-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-fe.outputs.tags }}
          labels: ${{ steps.meta-fe.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---- Deploy: pull the new images on the VPS -----------------------------
  # Optional. Enable by setting repo variable DEPLOY_ENABLED=true and secrets
  # VPS_HOST / VPS_USER / VPS_SSH_KEY (one-time setup checklist lives outside
  # the repo). The VPS pulls the static frontend image from GHCR and restarts
  # the lightweight Caddy + frontend stack.
  deploy:
    name: Deploy to VPS
    needs: images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    steps:
      - id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Pull & restart over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/GleWorks
            git remote set-url origin https://github.com/WillGle/gleworks-portfolio.git
            git pull --ff-only
            sed -i '/^FRONTEND_IMAGE=/d' deploy/.env
            echo "FRONTEND_IMAGE=ghcr.io/${{ steps.owner.outputs.lc }}/glework-frontend:latest" >> deploy/.env
            docker compose -f deploy/docker-compose.fallback.yml --env-file deploy/.env pull frontend
            docker compose -f deploy/docker-compose.fallback.yml --env-file deploy/.env up -d --no-build
            docker image prune -f
