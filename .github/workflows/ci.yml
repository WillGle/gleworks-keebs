name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout mã nguồn
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js 22 & kích hoạt sẵn npm cache của GitHub Actions
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      # 3. Cài đặt dependencies sạch từ lockfile
      - name: Install dependencies
        run: npm ci

      # 4. Cài đặt Chromium cho Playwright E2E
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # 5. Các bước kiểm tra chất lượng (Quality Gates)
      - name: Run Linter
        run: npm run lint

      - name: Run Type Check
        run: npm run type-check

      - name: Run Unit & Coverage Tests
        run: npm run test:coverage

      - name: Run Production Build
        run: npm run build

      - name: Validate Build Artifacts
        run: node --test scripts/test-build.mjs

      - name: Validate Vite Server Lifecycle
        run: node --test scripts/test-vite.mjs

      - name: Run Browser E2E Tests
        run: npm run test:e2e

      # 6. Lưu trữ bản build tĩnh dist/ làm Artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gleworks-dist
          path: dist/
          retention-days: 7

      # 7. Luôn lưu thư mục logs/ (kể cả khi test fail) để debug trace & report
      - name: Upload Test & Run Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-logs
          path: logs/
          retention-days: 7
